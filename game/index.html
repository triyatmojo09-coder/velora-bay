<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velora Bay — Every Tide Brings Trouble</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23241b4d'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23ffd166'%3EV%3C/text%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Anton";
    src: url("./fonts/anton-latin.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Rajdhani";
    src: url("./fonts/rajdhani-500-latin.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Rajdhani";
    src: url("./fonts/rajdhani-600-latin.woff2") format("woff2");
    font-weight: 600; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Rajdhani";
    src: url("./fonts/rajdhani-700-latin.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241b4d; font-family: "Rajdhani", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Velora Bay: a top-down open-world crime game at dusk. Drive with WASD, enter cars with E, toggle headlights with L, aim with the mouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
